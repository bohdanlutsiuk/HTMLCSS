<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Box-model</title>
    <style>
      main {
        display: flex;
        justify-content: space-evenly;
        margin: 80px 20%;
      }
      .box1,
      .box2 {
        width: 400px;
        height: 400px;
        padding: 20px;
        border: 15px solid purple;
        margin: 10px;
        display: table;
      }
      .box1 {
        box-sizing: content-box;
      }
      .box2 {
        box-sizing: border-box;
      }
      .insidebox {
        display: table-cell;
        background-color: lightgreen;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Box-model</h1>
    </header>

    <main>
      <div class="box1">
        <div class="insidebox"></div>
      </div>
      <div class="box2">
        <div class="insidebox"></div>
      </div>
    </main>
  </body>
</html>
