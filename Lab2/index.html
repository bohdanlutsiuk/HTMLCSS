<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Plans</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Наші тарифи</h1>
    </header>
    <main>
      <h2>Оберіть план, який найкраще підходить для ваших завдань</h2>
      <section class="pricing-container">
        <article class="pricing-card">
          <h3 class="plan-name">Basic</h3>
          <span class="price"> $10<span class="month-caption">/ month</span> </span>
          <ul class="features-list">
            <li>1 User</li>
            <li>5GB Storage</li>
            <li>Basic Support</li>
          </ul>
          <button class="btn btn-primary">Select</button>
        </article>
        <article class="card pricing-card pricing-card-featured">
          <span class="pricing-card-featured-before">Pro • Active</span>
          <h3 class="plan-name">Pro</h3>
          <span class="price"> $29<span class="month-caption">/ month</span> </span>
          <ul class="features-list">
            <li>5 Users</li>
            <li>50GB Storage</li>
            <li>Priority Support</li>
          </ul>
          <button class="btn btn-primary btn-primary-active">Get Started</button>
        </article>
        <article class="card pricing-card">
          <h3 class="plan-name">Enterprise</h3>
          <span class="price"> $10<span class="month-caption">/ month</span> </span>
          <ul class="features-list">
            <li>Unlimited</li>
            <li>1TB Storage</li>
            <li>24/7 Support</li>
          </ul>
          <button class="btn btn-primary">Contact</button>
        </article>
      </section>
    </main>
  </body>
</html>
